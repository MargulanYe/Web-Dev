<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Вход или регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        
        <div class="left-column">
            <h1 class="logo">facebook</h1>
            <p class="slogan">Facebook помогает вам всегда оставаться на связи и общаться со своими знакомыми.</p>
        </div>

        <div class="right-column">
            <div class="login-card">
                <form>
                    <input type="text" placeholder="Электронный адрес или номер телефона">
                    <input type="password" placeholder="Пароль">
                    <button type="button" class="login-btn">Вход</button>
                    <a href="#" class="forgot-link">Забыли пароль?</a>
                </form>
                
                <hr class="divider">
                
                <button type="button" class="create-btn">Создать новый аккаунт</button>
            </div>
            
            <p class="create-page-text"><a href="#">Создать Страницу</a> знаменитости, музыкальной группы или компании.</p>
        </div>

    </div>

</body>
</html>
