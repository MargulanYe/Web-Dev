<h1>Online Store</h1>

<div class="categories">
  <button
    *ngFor="let c of categories"
    (click)="selectCategory(c.id)"
    [class.active]="c.id === selectedCategoryId">
    {{ c.name }}
  </button>
</div>

<app-product-list
  [products]="filteredProducts"
  (deleteProduct)="deleteFromAll($event)">
</app-product-list>
